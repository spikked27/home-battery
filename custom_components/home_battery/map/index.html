<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Regional precipitation radar</title>
<link rel="stylesheet" href="leaflet.css"><style>
html,body{margin:0;height:100%;background:#101b28;color:#e7eef8;font:13px system-ui}body{display:flex;flex-direction:column}#map{flex:1;min-height:230px;background:#142436}.base-tiles{filter:brightness(.8) saturate(.65)}.controls{padding:10px;display:flex;align-items:center;gap:9px;background:#142436}button{background:#23374b;border:1px solid #557089;color:#e7eef8;border-radius:7px;padding:7px 10px;cursor:pointer}input{flex:1;min-width:40px;accent-color:#2dd4bf}#stamp{white-space:nowrap}.legend{padding:5px 12px;display:flex;gap:8px;align-items:center;font-size:11px}.ramp{height:7px;width:100px;background:linear-gradient(90deg,#78c9ff,#2979ff,#41cf65,#ffda3d,#ea3243);border-radius:8px}#error{padding:8px 12px;color:#ffc870;display:none}.leaflet-control-attribution{font-size:10px}.leaflet-control-attribution a{color:#135878}
</style><div id="map" aria-label="Regional observed radar map"></div><div id="error" role="status"></div><div class="controls"><button id="play" aria-label="Play radar animation">▶</button><input id="frame" type="range" min="0" max="0" value="0" aria-label="Radar observation time"><span id="stamp">Loading…</span><button id="home" aria-label="Recenter radar">⌖</button></div><div class="legend"><span>Light</span><span class="ramp"></span><span>Heavy precipitation · observed, not forecast</span></div>
<script src="leaflet.js"></script><script>
const p=new URLSearchParams(location.search),lat=Number(p.get('lat')),lon=Number(p.get('lon'));
const center=Number.isFinite(lat)&&Number.isFinite(lon)&&Math.abs(lat)<=85&&Math.abs(lon)<=180?[lat,lon]:[39,-98];
const map=L.map('map',{scrollWheelZoom:false,minZoom:3,maxZoom:9}).setView(center,7);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{className:'base-tiles',attribution:'Map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · Radar <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">RainViewer</a>',maxZoom:9}).addTo(map);
L.control.scale({imperial:true,metric:false}).addTo(map);
let frames=[],host='',index=0,layer,timer=null;const cache=new Map(),range=document.querySelector('#frame'),stamp=document.querySelector('#stamp'),play=document.querySelector('#play'),error=document.querySelector('#error');
function show(i){if(!frames.length)return;index=(i+frames.length)%frames.length;const f=frames[index];range.value=index;stamp.textContent=new Date(f.time*1000).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});let next=cache.get(f.path);if(!next){next=L.tileLayer(host+f.path+'/256/{z}/{x}/{y}/2/1_1.png',{opacity:.7,maxNativeZoom:7,maxZoom:9,zIndex:4});cache.set(f.path,next);}if(layer&&layer!==next)map.removeLayer(layer);layer=next;layer.addTo(map);for(const [key,value] of cache){if(cache.size>4&&value!==layer){map.removeLayer(value);cache.delete(key);}}}
function pause(){clearInterval(timer);timer=null;play.textContent='▶';play.setAttribute('aria-label','Play radar animation');}
play.onclick=()=>{if(timer){pause();return;}if(!frames.length)return;play.textContent='❚❚';play.setAttribute('aria-label','Pause radar animation');timer=setInterval(()=>show(index+1),850);};range.oninput=()=>{pause();show(Number(range.value));};document.querySelector('#home').onclick=()=>map.setView(center,7);
async function refresh(){try{const response=await fetch('https://api.rainviewer.com/public/weather-maps.json',{referrerPolicy:'no-referrer',signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error('Radar provider unavailable');const data=await response.json(),url=new URL(data.host);if(url.protocol!=='https:'||!(url.hostname==='rainviewer.com'||url.hostname.endsWith('.rainviewer.com')))throw Error('Unexpected radar host');const list=(data.radar?.past||[]).filter(f=>/^\/v2\/radar\/\d+$/.test(f.path)&&Number.isFinite(f.time));if(!list.length)throw Error('No radar observations available');host=url.origin;frames=list.slice(-7);range.max=frames.length-1;show(frames.length-1);const stale=Date.now()/1000-frames.at(-1).time>1800;error.textContent=stale?'Radar observations are over 30 minutes old. Check official alerts.':'';error.style.display=stale?'block':'none';}catch(e){error.textContent='Radar unavailable. Official weather alerts still drive reserve advice.';error.style.display='block';stamp.textContent='Unavailable';pause();}}
refresh();setInterval(refresh,300000);new ResizeObserver(()=>map.invalidateSize()).observe(document.querySelector('#map'));
</script></html>
