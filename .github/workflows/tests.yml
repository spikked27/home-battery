name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Home Assistant test harness
        run: python -m pip install pytest-homeassistant-custom-component tzdata
      - name: Syntax and HA-backed tests
        run: |
          python -m compileall -q custom_components
          python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check custom_components/home_battery/frontend.js
      - run: node tests/frontend.test.cjs
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
